<script>
  function escapeHtml(value) {
    return String(value === null || value === undefined ? '' : value).replace(/[&<>"']/g, function(character) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#x27;'}[character];
    });
  }

  document.addEventListener('click', function(event) {
    var button = event.target.closest && event.target.closest('button');
    if (!button || (!button.type || button.type !== 'submit') && !/(kirim|simpan|retry|scheduler|scheduler|pasang|test|aktifkan)/i.test(button.textContent || '')) return;
    if (button.dataset.busy === 'true') { event.preventDefault(); return; }
    button.dataset.busy = 'true'; button.disabled = true; button.dataset.busyLabel = button.textContent;
    window.setTimeout(function() { button.disabled = false; button.dataset.busy = 'false'; }, 5000);
  }, true);
  // Toggle global untuk debug mode (Console Logging Frontend)
  const viewLog = true;
  function logDebug(emoji, msg, data) {
    if (viewLog) {
      console.log(`${emoji} [FRONTEND] ${msg}`, data || '');
    }
  }

  // App State
  const AppState = {
    isAuthenticated: false,
    currentUser: null,
    projects: [],
    users: [],
    progressLogs: [],
    selectedProject: null,
    currentTab: 'overview'
  };

  // DOM Content Loaded
  document.addEventListener('DOMContentLoaded', () => {
    setupTabNavigation();
    setupMobileSidebar();
    setupPasswordToggles();
    setupPasswordPolicyLiveCheck();
    setupChannelLayout();
    setupNotificationSettingsLayout();
    setupNotificationFrequencyFields();
    setupScheduleActionButtons();
    checkActiveSession();
  });

  function setupChannelLayout() {
    const waForm = document.getElementById('waTestForm');
    const adminCard = document.getElementById('notificationAdminCard');
    if (!waForm || !adminCard) return;
    const waCard = waForm.closest('.card');
    const tokenForm = adminCard.querySelector('form[onsubmit*="saveNotificationToken"]');
    const emailForm = adminCard.querySelector('form[onsubmit*="handleSendTestEmail"]');
    if (!waCard || !tokenForm || !emailForm || document.getElementById('notificationEmailCard')) return;

    waCard.classList.add('channel-card');
    const waHeader = waCard.querySelector('.card-title');
    const waDesc = waCard.querySelector('.card-desc');
    if (waHeader) waHeader.textContent = '💬 WhatsApp / Fonnte';
    if (waDesc) waDesc.textContent = 'Konfigurasi provider dan uji pengiriman WhatsApp secara terpisah dari email.';

    const subcards = document.createElement('div');
    subcards.className = 'channel-subcards';
    const waSubcard = document.createElement('div');
    waSubcard.className = 'channel-subcard';
    waSubcard.appendChild(waForm);
    const tokenSubcard = document.createElement('div');
    tokenSubcard.className = 'channel-subcard';
    tokenSubcard.innerHTML = '<div class="channel-subcard-header"><span class="channel-icon">⚙️</span><div><h4>Token Fonnte API</h4><p>Token disimpan aman di Script Properties dan tidak pernah ditampilkan kembali.</p></div></div>';
    tokenSubcard.appendChild(tokenForm);
    subcards.appendChild(tokenSubcard);
    subcards.appendChild(waSubcard);
    waCard.appendChild(subcards);

    const emailCard = document.createElement('div');
    emailCard.id = 'notificationEmailCard';
    emailCard.className = 'card channel-card';
    emailCard.innerHTML = '<div class="card-header"><h3 class="card-title">✉️ Email Test</h3><p class="card-desc">Email dikirim melalui GmailApp/MailApp dan tidak bergantung pada token Fonnte.</p></div>';
    const emailSubcard = document.createElement('div');
    emailSubcard.className = 'channel-subcard';
    emailSubcard.innerHTML = '<div class="channel-subcard-header"><span class="channel-icon">✉️</span><div><h4>Uji Integrasi Email</h4><p>Gunakan alamat staging terlebih dahulu sebelum menguji penerima resmi.</p></div></div>';
    emailSubcard.appendChild(emailForm);
    emailCard.appendChild(emailSubcard);
    waCard.parentNode.insertBefore(emailCard, waCard.nextSibling);
    adminCard.remove();
  }

  function setupNotificationSettingsLayout() {
    const card = document.getElementById('recipientRuleCard');
    if (!card || card.dataset.layoutReady) return;
    const forms = card.querySelectorAll('form');
    if (forms.length < 2) return;
    card.dataset.layoutReady = 'true';
    const adminCard = document.getElementById('notificationAdminItemCard');
    if (adminCard) setupAdministrativeItemFields(adminCard);
    const headerTitle = card.querySelector('.card-title');
    const headerDesc = card.querySelector('.card-desc');
    if (headerTitle) headerTitle.textContent = '👥 Recipient Groups & Notification Rules';
    if (headerDesc) headerDesc.textContent = 'Susun penerima terlebih dahulu, kemudian buat aturan kapan dan melalui channel apa notifikasi dikirim.';
    const groupHeading = document.createElement('div');
    groupHeading.className = 'settings-section-heading';
    groupHeading.innerHTML = '<span class="section-step">1</span><div><h4>Recipient Group</h4><p>Atur penerima email To/CC/BCC dan nomor WhatsApp. Group dapat digunakan ulang oleh beberapa rule.</p></div>';
    forms[0].parentNode.insertBefore(groupHeading, forms[0]);
    const ruleHeading = document.createElement('div');
    ruleHeading.className = 'settings-section-heading settings-section-heading-rule';
    ruleHeading.innerHTML = '<span class="section-step">2</span><div><h4>Notification Rule &amp; Schedule</h4><p>Tentukan event, frekuensi, waktu, template, dan group penerima yang digunakan.</p></div>';
    forms[1].parentNode.insertBefore(ruleHeading, forms[1]);
    const help = document.createElement('div');
    help.className = 'settings-help-banner';
    help.innerHTML = '<strong>Alur penggunaan:</strong> Simpan group → salin Group ID → pilih event dan jadwal → simpan rule. Untuk rule administrasi, Project ID boleh dikosongkan.';
    card.querySelector('.card-header').after(help);
    document.querySelectorAll('#tabSettings label').forEach(function(label) { label.classList.add('settings-form-label'); });
    const dedupeInput = document.getElementById('notificationRuleDedupe');
    const dedupeLabel = dedupeInput && dedupeInput.closest('.form-group') && dedupeInput.closest('.form-group').querySelector('label');
    if (dedupeLabel) {
      dedupeLabel.innerHTML = 'Dedupe (menit) <span class="field-tooltip" tabindex="0" data-tooltip="Jeda minimum dalam menit sebelum event dan penerima yang sama boleh menerima notifikasi lagi.">?</span>';
      dedupeInput.setAttribute('title', 'Jeda minimum sebelum notifikasi event dan penerima yang sama dikirim kembali.');
    }
    const tips = {
      fonnteTokenInput: 'Token rahasia untuk mengirim WhatsApp melalui Fonnte. Disimpan di Script Properties.',
      waTestPhone: 'Nomor tujuan untuk pesan WhatsApp percobaan.',
      emailTestRecipient: 'Alamat tujuan untuk email percobaan melalui GmailApp/MailApp.',
      notificationAdminItemTitle: 'Judul pengingat administrasi yang akan ditampilkan kepada penerima.',
      notificationAdminItemDescription: 'Detail tindakan atau informasi administrasi yang perlu disampaikan.',
      notificationAdminItemCategory: 'Kategori administrasi, misalnya COMPLIANCE atau PAYMENT.',
      notificationAdminItemOwner: 'PIC atau pemilik tindakan administrasi.',
      notificationAdminItemStatus: 'Status lifecycle item. COMPLETED/CANCELLED menghentikan pengingat.',
      notificationAdminItemDueDate: 'Tanggal batas waktu administrasi.',
      notificationAdminItemThreshold: 'Berapa hari sebelum tenggat pengingat mulai dikirim.',
      notificationAdminItemRuleId: 'Rule administratif yang menentukan group dan jadwal pengiriman.',
      notificationTemplateName: 'Nama identifikasi template pada konfigurasi notifikasi.',
      notificationTemplateChannel: 'Channel yang menggunakan template ini.',
      notificationTemplateSubject: 'Subject email atau judul pesan notifikasi.',
      notificationTemplateBody: 'Isi pesan. Gunakan placeholder yang didukung aplikasi.',
      notificationGroupName: 'Nama group yang akan digunakan kembali pada satu atau beberapa notification rule.',
      notificationGroupProjectId: 'Project ID untuk membatasi group pada proyek tertentu. Kosongkan untuk group umum.',
      notificationGroupRoles: 'Role penerima yang terkait dengan group, dipisahkan dengan koma.',
      notificationEmailTo: 'Penerima utama email. Pisahkan beberapa alamat dengan koma, titik koma, atau baris baru.',
      notificationEmailCc: 'Penerima salinan email yang terlihat oleh penerima lain.',
      notificationEmailBcc: 'Penerima salinan tersembunyi. Alamat tidak terlihat oleh penerima lain.',
      notificationWhatsAppNumbers: 'Nomor WhatsApp penerima. Nomor akan dinormalisasi ke format internasional.',
      notificationRuleProjectId: 'Project yang memicu rule. Kosongkan untuk rule administratif tanpa proyek.',
      notificationRuleGroupId: 'Group ID tujuan notifikasi. Gunakan ID dari daftar Recipient Group.',
      notificationRuleEvent: 'Peristiwa yang memicu notifikasi.',
      notificationRuleFrequency: 'Pola waktu pengiriman: event, harian, mingguan, atau hari custom.',
      notificationRuleTime: 'Jam lokal ketika scheduler memproses rule terjadwal.',
      notificationRuleTemplateId: 'Template custom yang digunakan saat pesan dibuat.',
      notificationRuleDays: 'Hari pengiriman: 1 = Senin sampai 7 = Minggu.',
      notificationRuleDedupe: 'Jeda minimum dalam menit sebelum event dan penerima yang sama boleh menerima notifikasi lagi.'
    };
    Object.keys(tips).forEach(function(id) {
      const field = document.getElementById(id);
      const label = field && field.closest('.form-group') && field.closest('.form-group').querySelector('label');
      if (label && !label.querySelector('.field-tooltip')) {
        label.insertAdjacentHTML('beforeend', ' <span class="field-tooltip" tabindex="0" data-tooltip="' + tips[id] + '">?</span>');
      }
      if (field) field.setAttribute('title', tips[id]);
    });
  }

  function setupAdministrativeItemFields(card) {
    const title = card.querySelector('.card-title');
    const desc = card.querySelector('.card-desc');
    if (title) title.textContent = '🗂️ Pengingat Administrasi';
    if (desc) desc.textContent = 'Catat kewajiban administrasi yang tidak terkait langsung dengan proyek, lalu kirim pengingat berdasarkan tenggat.';
    const fields = [
      ['notificationAdminItemTitle', 'Judul Administrasi', 'Nama singkat kewajiban atau aktivitas administrasi.'],
      ['notificationAdminItemDescription', 'Deskripsi dan Tindakan', 'Jelaskan detail, dokumen, atau tindakan yang harus dilakukan.'],
      ['notificationAdminItemCategory', 'Kategori', 'Contoh: COMPLIANCE, PAYMENT, DOCUMENT, atau GENERAL.'],
      ['notificationAdminItemOwner', 'PIC / Owner', 'Orang yang bertanggung jawab menindaklanjuti item ini.'],
      ['notificationAdminItemStatus', 'Status', 'COMPLETED atau CANCELLED akan menghentikan pengingat.'],
      ['notificationAdminItemDueDate', 'Tanggal Tenggat', 'Tanggal batas waktu penyelesaian administrasi.'],
      ['notificationAdminItemThreshold', 'Pengingat H-', 'Jumlah hari sebelum tenggat ketika pengingat mulai dikirim.'],
      ['notificationAdminItemRuleId', 'Rule ID Administratif', 'Rule yang menentukan group, channel, template, dan jadwal pengiriman.']
    ];
    fields.forEach(function(item) {
      const field = document.getElementById(item[0]);
      if (!field || field.dataset.helpReady) return;
      const group = field.closest('.form-group') || field.parentElement;
      if (!group) return;
      const label = document.createElement('label');
      label.className = 'form-label settings-form-label';
      label.setAttribute('for', item[0]);
      label.innerHTML = item[1] + ' <span class="field-tooltip" tabindex="0" data-tooltip="' + item[2] + '">?</span>';
      group.insertBefore(label, field);
      field.setAttribute('title', item[2]);
      field.dataset.helpReady = 'true';
    });
  }

  function setupNotificationFrequencyFields() {
    const frequency = document.getElementById('notificationRuleFrequency');
    const time = document.getElementById('notificationRuleTime');
    const days = document.getElementById('notificationRuleDays');
    if (!frequency || !time || !days) return;
    const timeGroup = time.closest('.form-group');
    const daysGroup = days.closest('.form-group');
    if (!timeGroup || !daysGroup) return;
    const help = document.createElement('small');
    help.className = 'field-help frequency-help';
    frequency.closest('.form-group').appendChild(help);
    const update = function() {
      const value = frequency.value;
      const isEvent = value === 'EVENT';
      timeGroup.hidden = isEvent;
      daysGroup.hidden = isEvent;
      days.required = value === 'WEEKLY' || value === 'CUSTOM';
      if (value === 'DAILY') {
        days.placeholder = 'Opsional: 1,2,3,4,5';
        help.textContent = 'Pengiriman berjalan setiap hari pada jam yang dipilih.';
      } else if (value === 'WEEKLY') {
        days.placeholder = 'Wajib: 1,2,3,4,5';
        help.textContent = 'Pilih hari dalam format 1–7, dengan 1 = Senin.';
      } else if (value === 'CUSTOM') {
        days.placeholder = 'Wajib, contoh: 2,4,6';
        help.textContent = 'Gunakan hari tertentu dan jam pengiriman yang ditentukan.';
      } else {
        help.textContent = 'Notifikasi dikirim berdasarkan event; jadwal hari dan jam tidak digunakan.';
      }
    };
    frequency.addEventListener('change', update);
    update();
  }

  function setupScheduleActionButtons() {
    const card = document.getElementById('recipientRuleCard');
    if (!card) return;
    const ruleForm = Array.from(card.querySelectorAll('form')).find(function(form) { return typeof form.getAttribute('onsubmit') === 'string' && form.getAttribute('onsubmit').indexOf('saveNotificationRule') >= 0; });
    const saveButton = ruleForm && ruleForm.querySelector('button[type="submit"]');
    const schedulerButton = card.querySelector('button[onclick*="installNotificationScheduler"]');
    let actionRow = card.querySelector('.settings-actions-row');
    if (!actionRow) {
      actionRow = document.createElement('div');
      actionRow.className = 'settings-actions-row';
      const ruleForm = saveButton && saveButton.closest('form');
      const schedulerWrapper = schedulerButton && schedulerButton.parentElement;
      if (ruleForm && schedulerWrapper) {
        ruleForm.parentNode.insertBefore(actionRow, schedulerWrapper);
        actionRow.appendChild(ruleForm.querySelector('.settings-action-toolbar') || saveButton);
        actionRow.appendChild(schedulerWrapper);
      }
    }
    if (saveButton) {
      saveButton.classList.add('settings-action-primary', 'action-tooltip');
      saveButton.textContent = 'Simpan Notification Rule';
      saveButton.setAttribute('data-tooltip', 'Menyimpan event, penerima, frekuensi, waktu, template, dan deduplikasi rule ini.');
      saveButton.setAttribute('title', 'Simpan Notification Rule');
      const saveToolbar = document.createElement('div');
      saveToolbar.className = 'settings-action-toolbar';
      if (saveButton.parentNode) saveButton.parentNode.insertBefore(saveToolbar, saveButton);
      saveToolbar.appendChild(saveButton);
    }
    if (schedulerButton) {
      schedulerButton.classList.add('settings-action-secondary', 'action-tooltip');
      schedulerButton.textContent = 'Aktifkan Scheduler';
      schedulerButton.setAttribute('data-tooltip', 'Memasang scheduler Apps Script yang menjalankan sweep notifikasi dan retry otomatis setiap jam.');
      schedulerButton.setAttribute('title', 'Aktifkan Scheduler notifikasi setiap jam');
      const wrapper = schedulerButton.parentElement;
      if (wrapper) wrapper.classList.add('settings-action-toolbar');
    }
  }

  // ==========================================
  // 1. SESSION & AUTHENTICATION
  // ==========================================

  const IDLE_TIMEOUT_MINUTES = 60; // default 1 jam; tidak disimpan di sheet
  const MIN_IDLE_TIMEOUT_MINUTES = 5;
  const MAX_IDLE_TIMEOUT_MINUTES = 480;
  const EFFECTIVE_IDLE_TIMEOUT_MINUTES = Math.min(MAX_IDLE_TIMEOUT_MINUTES, Math.max(MIN_IDLE_TIMEOUT_MINUTES, IDLE_TIMEOUT_MINUTES));
  const IDLE_TIMEOUT_MS = EFFECTIVE_IDLE_TIMEOUT_MINUTES * 60 * 1000;
  let idleTimer = null;

  function saveLocalSession(user, loginAt, sessionToken) {
    const now = Date.now();
    localStorage.setItem('sysrem_session', JSON.stringify({
      user: user,
      sessionToken: sessionToken || '',
      loginAt: loginAt || now,
      lastActivityAt: now,
      expiresAt: now + IDLE_TIMEOUT_MS
    }));
  }

  function clearLocalSession() {
    localStorage.removeItem('sysrem_session');
  }

  function resetIdleTimer() {
    if (idleTimer) clearTimeout(idleTimer);
    if (AppState.isAuthenticated) {
      const raw = localStorage.getItem('sysrem_session');
      if (raw) {
        try {
          const session = JSON.parse(raw);
          const now = Date.now();
          session.lastActivityAt = now;
          session.expiresAt = now + IDLE_TIMEOUT_MS;
          localStorage.setItem('sysrem_session', JSON.stringify(session));
        } catch (e) {
          clearLocalSession();
        }
      }
      idleTimer = setTimeout(() => {
        showToast("Sesi berakhir otomatis karena tidak ada aktivitas.", "warning");
        logoutUser();
      }, IDLE_TIMEOUT_MS);
    }
  }

  // Monitor aktivitas pengguna untuk mencegah auto-logout saat sedang aktif
  ['mousemove', 'keydown', 'scroll', 'click'].forEach(evt => {
    document.addEventListener(evt, resetIdleTimer);
  });

  function checkActiveSession() {
    const savedSession = localStorage.getItem('sysrem_session');
    if (savedSession) {
      try {
        const stored = JSON.parse(savedSession);
        const now = Date.now();
        const session = stored.user ? stored : { user: stored, loginAt: now, lastActivityAt: now, expiresAt: now + IDLE_TIMEOUT_MS };
        if (!session.expiresAt || now >= Number(session.expiresAt)) {
          clearLocalSession();
          renderAuthScreen();
          return;
        }
        const userData = session.user;
        AppState.isAuthenticated = true;
        AppState.currentUser = userData;
        renderAuthenticatedApp();
        resetIdleTimer();
        return;
      } catch (e) {
        clearLocalSession();
      }
    }

    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      console.info("Running in Preview / Standalone Mock mode.");
      AppState.isAuthenticated = true;
      AppState.currentUser = { email: "admin@system.local", role: "ADMINISTRATOR" };
      renderAuthenticatedApp();
      return;
    }

    showLoading("Memverifikasi sesi pengguna...");
    google.script.run
      .withSuccessHandler((response) => {
        logDebug("✅", "GAS Response OK:", response);
        hideLoading();
        if (response && response.success && response.data && response.data.isAuthenticated) {
          AppState.isAuthenticated = true;
          AppState.currentUser = response.data.user;
          saveLocalSession(response.data.user);
          renderAuthenticatedApp();
          resetIdleTimer();
        } else {
          renderAuthScreen();
        }
      })
      .withFailureHandler((err) => {
        logDebug("❌", "GAS Response ERROR:", err);
        hideLoading();
        renderAuthScreen();
      })
      .apiCheckSession();
  }

  function renderAuthScreen() {
    document.getElementById('authContainer').classList.remove('hidden');
    document.getElementById('dashboardLayout').classList.add('hidden');
    document.getElementById('loginCard').classList.remove('hidden');
    document.getElementById('changePasswordCard').classList.add('hidden');
  }

  function renderAuthenticatedApp() {
    document.getElementById('authContainer').classList.add('hidden');
    document.getElementById('dashboardLayout').classList.remove('hidden');

    if (AppState.currentUser) {
      const email = AppState.currentUser.email || "user@system";
      const initial = email.charAt(0).toUpperCase();
      document.getElementById('sidebarAvatar').textContent = initial;
      document.getElementById('sidebarUserName').textContent = email.split('@')[0];
      document.getElementById('sidebarUserRole').textContent = AppState.currentUser.role || "MEMBER";

      const navUsersTab = document.getElementById('navUsersTab');
      if (navUsersTab) {
        if (AppState.currentUser.role === "ADMINISTRATOR") {
          navUsersTab.style.display = "flex";
        } else {
          navUsersTab.style.display = "none";
        }
      }
    }

    loadDashboardSummary();
    loadProjects();

    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      loadLocalDummyNotificationData();
      return;
    }
    
    if (AppState.currentUser && AppState.currentUser.role === "ADMINISTRATOR" && typeof google !== 'undefined' && google.script && google.script.run) {
      loadUsers();
      loadNotificationGroups();
      loadNotificationAdminItems();
      loadNotificationRules();
      loadNotificationTemplates();
    }
  }

  function loadLocalDummyNotificationData() {
    const data = getLocalDummyNotificationData();
    renderNotificationGroups(data.groups);
    renderNotificationRules(data.rules);
    renderNotificationTemplates(data.templates);
    const adminList = document.getElementById('notificationAdminItemsList');
    if (adminList) adminList.innerHTML = data.adminItems.map(function(i) { return '<div class="card settings-list-item"><strong>🗂️ ' + escapeHtml(i.title) + '</strong><br><small>' + escapeHtml(i.category) + ' · ' + escapeHtml(i.status) + ' · deadline ' + escapeHtml(i.due_date) + '</small></div>'; }).join('');
    const deliveryList = document.getElementById('notificationDeliveriesList');
    if (deliveryList) deliveryList.innerHTML = '<div class="settings-help-banner">📦 Preview lokal: delivery audit dummy tersedia setelah backend GAS terhubung.</div>';
  }

  function getLocalDummyNotificationData() {
    return {
      groups: [{ group_id: 'grp_demo_management', group_name: 'Manajemen Proyek', project_id: 'PRJ-DEMO-001', recipient_roles: 'PIC,MANAGER', email_to: 'manager@example.com', email_cc: 'auditor@example.com', whatsapp_numbers: '6281234567890' }, { group_id: 'grp_demo_admin', group_name: 'Administrasi & Compliance', project_id: '', recipient_roles: 'ADMINISTRATOR,AUDITOR', email_to: 'admin@example.com', email_cc: '', whatsapp_numbers: '6289876543210' }],
      rules: [{ rule_id: 'rule_demo_delayed', project_id: 'PRJ-DEMO-001', event_type: 'DELAYED', frequency: 'DAILY', send_time: '08:00', days_of_week: '1,2,3,4,5', timezone: 'Asia/Jakarta' }, { rule_id: 'rule_demo_admin', project_id: '', event_type: 'ADMINISTRATIVE_REMINDER', frequency: 'WEEKLY', send_time: '09:00', days_of_week: '1', timezone: 'Asia/Jakarta' }],
      templates: [{ template_id: 'tpl_demo_email', template_name: 'Peringatan Administrasi', channel: 'EMAIL', template_version: 1, subject: '[Demo] Pengingat administrasi' }, { template_id: 'tpl_demo_wa', template_name: 'Status Proyek WhatsApp', channel: 'WHATSAPP', template_version: 1, subject: '' }],
      adminItems: [{ item_id: 'adm_demo_001', title: 'Perpanjangan izin operasional', category: 'COMPLIANCE', status: 'OPEN', due_date: '2026-12-15' }, { item_id: 'adm_demo_002', title: 'Review dokumen kontrak', category: 'DOCUMENT', status: 'IN_PROGRESS', due_date: '2026-11-25' }]
    };
  }

  // Handle Login Form Submit
  const loginForm = document.getElementById('loginForm');
  if (loginForm) {
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const identifier = document.getElementById('loginIdentifier').value.trim();
      const password = document.getElementById('loginPassword').value;
      const totpToken = document.getElementById('totpToken') ? document.getElementById('totpToken').value.trim() : "";

      showLoading("Memvalidasi kredensial login...");
      logDebug("⏳", "Memanggil apiLogin via GAS...");

      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        setTimeout(() => {
          hideLoading();
          AppState.isAuthenticated = true;
          AppState.currentUser = { email: identifier, role: "ADMINISTRATOR" };
          showToast("Login berhasil (Preview Mode)", "success");
          renderAuthenticatedApp();
        }, 500);
        return;
      }

      google.script.run
        .withSuccessHandler((response) => {
          logDebug("✅", "GAS Response OK:", response);
          hideLoading();
          if (response.success) {
            AppState.isAuthenticated = true;
            if (response.data.status === "REQUIRE_PASSWORD_CHANGE") {
              AppState.currentUser = response.data;
              document.getElementById('loginCard').classList.add('hidden');
              document.getElementById('changePasswordCard').classList.remove('hidden');
              showToast("Wajib mengganti password default Anda.", "info");
            } else {
              AppState.currentUser = response.data.user;
              saveLocalSession(response.data.user, Date.now(), response.data.sessionToken);
              showToast("Login berhasil! Selamat datang.", "success");
              renderAuthenticatedApp();
              resetIdleTimer();
            }
          } else {
            showToast(response.error.message || "Login gagal.", "error");
          }
        })
        .withFailureHandler((err) => {
        logDebug("❌", "GAS Response ERROR:", err);
          hideLoading();
          showToast(err.message || "Terjadi kesalahan sistem.", "error");
        })
        .apiLogin(identifier, password, totpToken);
    });
  }

  // Handle Change Password Form
  const changePasswordForm = document.getElementById('changePasswordForm');
  if (changePasswordForm) {
    changePasswordForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const oldPassword = document.getElementById('oldPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (newPassword !== confirmPassword) {

        logDebug("✅", "GAS Response OK:", response);

  function switchTab(tabName) {
    logDebug("🔀", "Beralih ke tab:", tabName);
    AppState.currentTab = tabName;

    // Update active nav links
    document.querySelectorAll('.sidebar-nav .nav-item').forEach((link) => {
      if (link.getAttribute('data-tab') === tabName) {
        link.classList.add('active');
      } else {
        link.classList.remove('active');
      }
    });

    // Update tab pane visibility
    document.querySelectorAll('.tab-pane').forEach((pane) => {
      pane.classList.remove('active');
    });

    const targetPane = document.getElementById('tab' + tabName.charAt(0).toUpperCase() + tabName.slice(1));
    if (targetPane) {
      targetPane.classList.add('active');
    }

    // Update Page Title
    const titleMap = {
      overview: 'Dashboard Ringkasan Proyek',
      projects: 'Project Management & Lifecycle',
      progress: 'Pencatatan Progres Harian Proyek',
      settings: 'Pengaturan Sistem & Uji Notifikasi'
    };
    document.getElementById('pageTitle').textContent = titleMap[tabName] || 'Dashboard System';

    // Auto-refresh relevant data on tab entry
    if (tabName === 'overview') loadDashboardSummary();
    if (tabName === 'projects') loadProjects();
    if (tabName === 'progress') populateProjectDropdowns();
  }

  function updateKPIMetrics(projects) {
    let total = projects.length;
    let onTrack = 0;
    let delayed = 0;
    let completed = 0;

    projects.forEach((p) => {
      const st = p.summary ? p.summary.status : (p.status === 'COMPLETED' ? 'COMPLETED' : 'ON_TRACK');
      if (st === 'COMPLETED' || p.status === 'COMPLETED') completed++;
      else if (st === 'DELAYED') delayed++;
      else onTrack++;
    });

    document.getElementById('kpiTotalProjects').textContent = total;
    document.getElementById('kpiOnTrack').textContent = onTrack;
    document.getElementById('kpiDelayed').textContent = delayed;
    document.getElementById('kpiCompleted').textContent = completed;
  }

        const statusBadge = getStatusBadgeHtml(s.status || p.status);
        const devClass = s.deviation < 0 ? 'color: var(--accent-red); font-weight: 600;' : 'color: var(--accent-green);';

        const statusBadge = getStatusBadgeHtml(p.status);

  function getStatusBadgeHtml(status) {
    switch (status) {
      case 'ON_TRACK':
      case 'AHEAD':
        return '<span class="status-badge badge-on-track">✅ On Track</span>';
      case 'DELAYED':
        return '<span class="status-badge badge-delayed">⚠️ Delayed</span>';
      case 'COMPLETED':
        return '<span class="status-badge badge-completed">🎉 Selesai</span>';
      default:
        return `<span class="status-badge badge-active">${status || 'ACTIVE'}</span>`;
    }
  }

  function handleProjectSearch(keyword) {
    const clean = keyword.toLowerCase();
    const filtered = AppState.projects.filter((item) => {
      const p = item.project || item;
      return (p.project_name && p.project_name.toLowerCase().includes(clean)) ||
             (p.pic_name && p.pic_name.toLowerCase().includes(clean)) ||
             (p.pic_email && p.pic_email.toLowerCase().includes(clean));
    });
    renderProjectTables(filtered);
  }

  function renderWbsTableAndChart(data) {
    const thead = document.getElementById('wbsTableHeader');
    const tbody = document.getElementById('wbsTableBody');
    const tfoot = document.getElementById('wbsTableFooter');

    // 1. Render Header
    let headHtml = `<th>No</th><th>Keterangan</th><th>Bobot (%)</th><th>Tanggal</th>`;
    data.periods.forEach(p => {
      headHtml += `<th>${p}</th>`;
    });
    headHtml += `<th>Aksi</th>`;
    thead.innerHTML = headHtml;

    // 2. Render Body (WBS Items)
    if (data.wbs.length === 0) {
      tbody.innerHTML = `<tr><td colspan="${data.periods.length + 5}" class="text-center py-4">Belum ada item WBS.</td></tr>`;
    } else {
      let bodyHtml = '';
      data.wbs.forEach((item, index) => {
        let rowHtml = `
          <tr>
            <td>${index + 1}</td>
            <td>${item.task_name}</td>
            <td>${item.weight}%</td>
            <td><small>${formatDateLocal(item.start_date)} - ${formatDateLocal(item.end_date)}</small></td>
        `;
        item.distribution.forEach(val => {
          rowHtml += `<td>${val > 0 ? val.toFixed(2) : '-'}</td>`;
        });
        rowHtml += `
            <td>
              <button class="btn btn-sm btn-outline" style="color:var(--accent-red);" onclick="deleteWbsItem('${item.wbs_id}')">Hapus</button>
            </td>
          </tr>
        `;
        bodyHtml += rowHtml;
      });
      tbody.innerHTML = bodyHtml;
    }

    // 3. Render Footer (Summary)
    const sum = data.summary;
    let footHtml = `
      <tr><td colspan="4" class="text-right"><strong>Bobot Rencana</strong></td>${sum.bobot_rencana.map(v => `<td>${v.toFixed(2)}</td>`).join('')}<td></td></tr>
      <tr><td colspan="4" class="text-right" style="color:#ef4444;"><strong>Akumulasi Rencana</strong></td>${sum.akumulasi_rencana.map(v => `<td style="color:#ef4444;">${v.toFixed(2)}</td>`).join('')}<td></td></tr>
      <tr><td colspan="4" class="text-right"><strong>Bobot Pelaksanaan</strong></td>${sum.bobot_pelaksanaan.map(v => `<td>${v.toFixed(2)}</td>`).join('')}<td></td></tr>
      <tr><td colspan="4" class="text-right" style="color:#10b981;"><strong>Akumulasi Pelaksanaan</strong></td>${sum.akumulasi_pelaksanaan.map(v => `<td style="color:#10b981;">${v.toFixed(2)}</td>`).join('')}<td></td></tr>
      <tr><td colspan="4" class="text-right"><strong>Deviasi</strong></td>${sum.deviasi.map(v => `<td style="${v < 0 ? 'color:#ef4444;' : 'color:#10b981;'}">${v > 0 ? '+' : ''}${v.toFixed(2)}</td>`).join('')}<td></td></tr>
    `;
    tfoot.innerHTML = footHtml;

    // 4. Render Chart
    drawSCurveChartWBS(data.periods, sum.akumulasi_rencana, sum.akumulasi_pelaksanaan);
  }

  function drawSCurveChartWBS(labels, plannedData, actualData) {
    const canvas = document.getElementById('sCurveChart');
    if (!canvas) return;
    
    if (sCurveChartInst) {
      sCurveChartInst.destroy();
    }

    sCurveChartInst = new Chart(canvas, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [
          {
            label: 'Aktual (Line Hijau)',
            data: actualData,
            borderColor: '#10b981', // Hijau
            backgroundColor: 'rgba(16, 185, 129, 0.1)',
            borderWidth: 3,
            tension: 0.4,
            fill: true,
            yAxisID: 'y'
          },
          {
            label: 'Rencana (S-Curve Merah)',
            data: plannedData,
            borderColor: '#ef4444', // Merah
            borderWidth: 3,
            borderDash: [5, 5],
            tension: 0.4,
            fill: false,
            yAxisID: 'y'
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            position: 'top',
            labels: { color: '#f8fafc', font: { family: 'Inter' } }
          },
          tooltip: { mode: 'index', intersect: false }
        },
        scales: {
          x: {
            grid: { color: 'rgba(255,255,255,0.05)' },
            ticks: { color: '#94a3b8' }
          },
          y: {
            min: 0,
            max: 100,
            position: 'right', // Sumbu Y skala 0-100% dikanan sesuai request
            grid: { color: 'rgba(255,255,255,0.05)' },
            ticks: { color: '#94a3b8', callback: function(value) { return value + '%'; } },
            title: { display: true, text: 'Scale 0-100%', color: '#94a3b8'}
          }
        }
      }
    });
  }

  function formatDateLocal(isoString) {
    if (!isoString || isoString === '-') return '-';
    try {
      const d = new Date(isoString);
      if (isNaN(d.getTime())) return isoString;
      return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
    } catch (e) {
      return isoString;
    }
  }

  function showLoading(msg) {
    const el = document.getElementById('globalLoading');
    if (el) {
      if (msg) document.getElementById('loadingText').textContent = msg;
      el.classList.remove('hidden');

  }

  function hideLoading() {

  function showToast(message, type = 'info') {
    const container = document.getElementById('toastContainer');
    if (!container) return;
    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    const iconMap = { success: '✅', error: '❌', info: 'ℹ️' };
    toast.innerHTML = `<span>${escapeHtml(iconMap[type] || 'ℹ️')}</span><span>${escapeHtml(message)}</span>`;
    container.appendChild(toast);
    setTimeout(() => {
      toast.style.opacity = '0';
      toast.style.transform = 'translateX(100%)';
      setTimeout(() => toast.remove(), 300);
    }, 4000);
  }

  function setupPasswordToggles() {
    document.querySelectorAll('.toggle-password').forEach((btn) => {
      btn.addEventListener('click', () => {
        const input = btn.previousElementSibling;
        if (input && input.tagName === 'INPUT') {
          const isPass = input.getAttribute('type') === 'password';
          input.setAttribute('type', isPass ? 'text' : 'password');
          btn.textContent = isPass ? '👁️' : '🔒';
        }
      });
    });
  }

  function setupPasswordPolicyLiveCheck() {
    const newPassInput = document.getElementById('newPassword');
    if (!newPassInput) return;

    newPassInput.addEventListener('input', (e) => {
      const val = e.target.value;
      updatePolicyRule('ruleLength', val.length >= 8);
      updatePolicyRule('ruleUpper', /[A-Z]/.test(val));
      updatePolicyRule('ruleLower', /[a-z]/.test(val));
      updatePolicyRule('ruleNumber', /[0-9]/.test(val));
      updatePolicyRule('ruleSpecial', /[^a-zA-Z0-9]/.test(val));
    });
  }

  function updatePolicyRule(elementId, isValid) {
    const el = document.getElementById(elementId);
    if (el) {
      if (isValid) el.classList.add('valid');
      else el.classList.remove('valid');
    }
  }

  // ==========================================
  // 6. USER MANAGEMENT & PROFILE SETTINGS
  // ==========================================

  function openProfileModal() {
    if (!AppState.currentUser) return;
    document.getElementById('profEmail').value = AppState.currentUser.email;
    document.getElementById('profRole').value = AppState.currentUser.role;
    document.getElementById('profilePasswordForm').reset();
    openModal('profileModal');
  }

  function submitProfileUpdate() {
    // Fungsi dummy, sementara kita hanya mendukung ganti password melalui form kedua
    showToast("Profil hanya bisa diubah melalui halaman ganti password.", "info");
  }

  function submitPasswordChange() {
    const oldPass = document.getElementById('profOldPassword').value;
    const newPass = document.getElementById('profNewPassword').value;
    const confPass = document.getElementById('profConfirmPassword').value;

    if (newPass !== confPass) {
      showToast("Konfirmasi password baru tidak cocok.", "error");
      return;
    }

    showLoading("Menyimpan password baru...");
    google.script.run
      .withSuccessHandler((response) => {
        hideLoading();
        if (response && response.success) {
          showToast("Password berhasil diubah.", "success");
          closeModal('profileModal');
          document.getElementById('profilePasswordForm').reset();
        } else {
          showToast(response.error ? response.error.message : "Gagal mengubah password.", "error");
        }
      })
      .withFailureHandler((err) => {
        hideLoading();
        showToast(err.message || "Kesalahan koneksi ke server.", "error");
      })
      .apiChangePassword(oldPass, newPass);
  }

  function loadUsers() {
    if (!AppState.currentUser || AppState.currentUser.role !== "ADMINISTRATOR") return;
    
    const tbody = document.getElementById('usersTableBody');
    if (tbody) tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4"><div class="skeleton-loader skeleton-row"></div></td></tr>';

    google.script.run
      .withSuccessHandler((response) => {
        if (response && response.success) {
          AppState.users = response.data || [];
          renderUsersTable(response.data);
        }
      })
      .apiGetAllUsers();
  }

  function renderUsersTable(users) {
    const tbody = document.getElementById('usersTableBody');
    if (!tbody) return;

    if (!users || users.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted">Belum ada pengguna.</td></tr>';
      return;
    }

    tbody.innerHTML = users.map(u => {
      const activeBadge = u.is_active ? '<span class="status-badge status-active">Aktif</span>' : '<span class="status-badge status-delayed">Nonaktif</span>';
      const lastLogin = u.last_login_at ? formatDateLocal(u.last_login_at) : "Belum pernah";
      return `
        <tr>
          <td><strong>${u.username}</strong></td>
          <td>${u.email}</td>
          <td>${u.role_name}</td>
          <td>${activeBadge}</td>
          <td><small class="text-muted">${lastLogin}</small></td>
          <td>
            <button type="button" class="btn btn-sm btn-outline" onclick="openEditUser('${u.user_id}')">Edit</button>
          </td>
        </tr>
      `;
    }).join('');
  }

  function openUserModal() {
    document.getElementById('userForm').reset();
    document.getElementById('umUserId').value = '';
    document.getElementById('userModalTitle').textContent = 'Tambah Pengguna Baru';
    document.getElementById('umPassword').disabled = false;
    openModal('userModal');
  }

  function openEditUser(userId) {
    const user = (AppState.users || []).find((u) => u.user_id === userId);
    if (!user) return showToast('Data pengguna tidak ditemukan.', 'error');
    document.getElementById('umUserId').value = user.user_id;
    document.getElementById('umEmail').value = user.email || '';
    document.getElementById('umUsername').value = user.username || '';
    document.getElementById('umPassword').value = '';
    document.getElementById('umPassword').disabled = true;
    document.getElementById('umRole').value = user.role_name || 'REGULAR_USER';
    document.getElementById('umStatus').value = String(user.is_active !== false);
    document.getElementById('userModalTitle').textContent = 'Edit Pengguna';
    openModal('userModal');
  }

  function submitUser() {
    const userId = document.getElementById('umUserId').value;
    if (userId) {
      showLoading('Memperbarui pengguna...');
      google.script.run.withSuccessHandler((response) => {
        hideLoading();
        if (response && response.success) {
          showToast('Pengguna berhasil diperbarui.', 'success');
          closeModal('userModal');
          loadUsers();
        } else showToast(response && response.error ? response.error.message : 'Gagal memperbarui pengguna.', 'error');
      }).withFailureHandler((err) => {
        hideLoading();
        showToast(err.message || 'Gagal memperbarui pengguna.', 'error');
      }).apiUpdateUser(userId, {
        role: document.getElementById('umRole').value,
        isActive: document.getElementById('umStatus').value === 'true'
      });
      return;
    }
    const payload = {
      email: document.getElementById('umEmail').value,
      username: document.getElementById('umUsername').value,
      password: document.getElementById('umPassword').value,
      role: document.getElementById('umRole').value
    };

    showLoading("Menyimpan pengguna baru...");
    google.script.run
      .withSuccessHandler((response) => {
        hideLoading();
        if (response && response.success) {
          showToast("Pengguna berhasil ditambahkan.", "success");
          closeModal('userModal');
          loadUsers(); // Refresh tabel
        } else {
          showToast(response.error ? response.error.message : "Gagal menambahkan pengguna.", "error");
        }
      })
      .withFailureHandler((err) => {
        hideLoading();
        showToast(err.message || "Terjadi kesalahan sistem.", "error");
      })
      .apiCreateUser(payload);
  }

          loadWBSData(payload.project_id);

  function deleteWbsItem(wbsId) {
    if (!confirm("Hapus item WBS ini?")) return;
    showLoading("Menghapus...");

        hideLoading();

          loadWBSData(document.getElementById('sCurveProjectSelect').value);
        } else {
          showToast(response && response.error ? response.error.message : "Gagal menghapus WBS.", "error");
        }
      })
      .withFailureHandler((err) => {
        hideLoading();
        showToast(err.message || "Gagal menghapus WBS.", "error");
      })

  // Dipanggil ketika select proyek di Modal Progres diubah
  function populateProgressWbsDropdown(projectId) {
    const wbsSelect = document.getElementById('progModalWbs');
    if (!wbsSelect) return;
    
    wbsSelect.innerHTML = '<option value="">-- Seluruh Proyek (Umum) --</option>';
    if (!projectId) return;

    // Untuk simple UI, kita buat panggil api getWBS
    google.script.run
      .withSuccessHandler((response) => {
        if (response && response.success && response.data && response.data.wbs) {
          response.data.wbs.forEach(item => {
            const opt = document.createElement('option');
            opt.value = item.wbs_id;
            opt.textContent = `${item.task_name} (Bobot: ${item.weight}%)`;
            wbsSelect.appendChild(opt);
          });
        }
      })
      .apiGetProjectWBSAndSchedule(projectId, "WEEKLY");
  }
