<script>
  // Toggle global untuk debug mode (Console Logging Frontend)
  const viewLog = true;
  function logDebug(emoji, msg, data) {
    if (viewLog) {
      console.log(`${emoji} [FRONTEND] ${msg}`, data || '');
    }
  }

  // App State
  const AppState = {
    isAuthenticated: false,
    currentUser: null,
    projects: [],
    selectedProject: null,
    currentTab: 'overview'
  };

  // DOM Content Loaded
  document.addEventListener('DOMContentLoaded', () => {
    setupTabNavigation();
    setupMobileSidebar();
    setupPasswordToggles();
    setupPasswordPolicyLiveCheck();
    checkActiveSession();
  });

  // ==========================================
  // 1. SESSION & AUTHENTICATION
  // ==========================================

  const IDLE_TIMEOUT_MS = 30 * 60 * 1000; // 30 menit
  let idleTimer = null;

  function resetIdleTimer() {
    if (idleTimer) clearTimeout(idleTimer);
    if (AppState.isAuthenticated) {
      idleTimer = setTimeout(() => {
        showToast("Sesi berakhir otomatis karena tidak ada aktivitas.", "warning");
        logoutUser();
      }, IDLE_TIMEOUT_MS);
    }
  }

  // Monitor aktivitas pengguna untuk mencegah auto-logout saat sedang aktif
  ['mousemove', 'keydown', 'scroll', 'click'].forEach(evt => {
    document.addEventListener(evt, resetIdleTimer);
  });

  function checkActiveSession() {
    const savedSession = sessionStorage.getItem('sysrem_session');
    if (savedSession) {
      try {
        const userData = JSON.parse(savedSession);
        AppState.isAuthenticated = true;
        AppState.currentUser = userData;
        renderAuthenticatedApp();
        resetIdleTimer();
        return;
      } catch (e) {
        sessionStorage.removeItem('sysrem_session');
      }
    }

    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      console.info("Running in Preview / Standalone Mock mode.");
      AppState.isAuthenticated = true;
      AppState.currentUser = { email: "admin@system.local", role: "ADMINISTRATOR" };
      renderAuthenticatedApp();
      return;
    }

    showLoading("Memverifikasi sesi pengguna...");
    google.script.run
      .withSuccessHandler((response) => {
        logDebug("✅", "GAS Response OK:", response);
        hideLoading();
        if (response && response.success && response.data && response.data.isAuthenticated) {
          AppState.isAuthenticated = true;
          AppState.currentUser = response.data.user;
          sessionStorage.setItem('sysrem_session', JSON.stringify(response.data.user));
          renderAuthenticatedApp();
          resetIdleTimer();
        } else {
          renderAuthScreen();
        }
      })
      .withFailureHandler((err) => {
        logDebug("❌", "GAS Response ERROR:", err);
        hideLoading();
        renderAuthScreen();
      })
      .apiCheckSession();
  }

  function renderAuthScreen() {
    document.getElementById('authContainer').classList.remove('hidden');
    document.getElementById('dashboardLayout').classList.add('hidden');
    document.getElementById('loginCard').classList.remove('hidden');
    document.getElementById('changePasswordCard').classList.add('hidden');
  }

  function renderAuthenticatedApp() {
    document.getElementById('authContainer').classList.add('hidden');
    document.getElementById('dashboardLayout').classList.remove('hidden');

    if (AppState.currentUser) {
      const email = AppState.currentUser.email || "user@system";
      const initial = email.charAt(0).toUpperCase();
      document.getElementById('sidebarAvatar').textContent = initial;
      document.getElementById('sidebarUserName').textContent = email.split('@')[0];
      document.getElementById('sidebarUserRole').textContent = AppState.currentUser.role || "MEMBER";

      const navUsersTab = document.getElementById('navUsersTab');
      if (navUsersTab) {
        if (AppState.currentUser.role === "ADMINISTRATOR") {
          navUsersTab.style.display = "flex";
        } else {
          navUsersTab.style.display = "none";
        }
      }
    }

    loadDashboardSummary();
    loadProjects();
    
    if (AppState.currentUser && AppState.currentUser.role === "ADMINISTRATOR") {
      loadUsers();
    }
  }

  // Handle Login Form Submit
  const loginForm = document.getElementById('loginForm');
  if (loginForm) {
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const identifier = document.getElementById('loginIdentifier').value.trim();
      const password = document.getElementById('loginPassword').value;
      const totpToken = document.getElementById('totpToken') ? document.getElementById('totpToken').value.trim() : "";

      showLoading("Memvalidasi kredensial login...");
      logDebug("⏳", "Memanggil apiLogin via GAS...");

      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        setTimeout(() => {
          hideLoading();
          AppState.isAuthenticated = true;
          AppState.currentUser = { email: identifier, role: "ADMINISTRATOR" };
          showToast("Login berhasil (Preview Mode)", "success");
          renderAuthenticatedApp();
        }, 500);
        return;
      }

      google.script.run
        .withSuccessHandler((response) => {
          logDebug("✅", "GAS Response OK:", response);
          hideLoading();
          if (response.success) {
            AppState.isAuthenticated = true;
            if (response.data.status === "REQUIRE_PASSWORD_CHANGE") {
              AppState.currentUser = response.data;
              document.getElementById('loginCard').classList.add('hidden');
              document.getElementById('changePasswordCard').classList.remove('hidden');
              showToast("Wajib mengganti password default Anda.", "info");
            } else {
              AppState.currentUser = response.data.user;
              sessionStorage.setItem('sysrem_session', JSON.stringify(response.data.user));
              showToast("Login berhasil! Selamat datang.", "success");
              renderAuthenticatedApp();
              resetIdleTimer();
            }
          } else {
            showToast(response.error.message || "Login gagal.", "error");
          }
        })
        .withFailureHandler((err) => {
        logDebug("❌", "GAS Response ERROR:", err);
          hideLoading();
          showToast(err.message || "Terjadi kesalahan sistem.", "error");
        })
        .apiLogin(identifier, password, totpToken);
    });
  }

  // Handle Change Password Form
  const changePasswordForm = document.getElementById('changePasswordForm');
  if (changePasswordForm) {
    changePasswordForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const oldPassword = document.getElementById('oldPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (newPassword !== confirmPassword) {
        showToast("Konfirmasi password baru tidak cocok.", "error");
        return;
      }

      const userId = AppState.currentUser ? AppState.currentUser.userId : "";
      showLoading("Memperbarui password...");

      google.script.run
        .withSuccessHandler((response) => {
        logDebug("✅", "GAS Response OK:", response);
          hideLoading();
          if (response.success) {
            showToast("Password berhasil diperbarui. Silakan login kembali.", "success");
            changePasswordForm.reset();
            document.getElementById('changePasswordCard').classList.add('hidden');
            document.getElementById('loginCard').classList.remove('hidden');
            AppState.isAuthenticated = false;
            AppState.currentUser = null;
          } else {
            showToast(response.error ? response.error.message : "Gagal memperbarui password.", "error");
          }
        })
        .withFailureHandler((err) => {
        logDebug("❌", "GAS Response ERROR:", err);
          hideLoading();
          showToast(err.message || "Terjadi kesalahan sistem.", "error");
        })
        .apiChangeInitialPassword(userId, oldPassword, newPassword);
    });
  }

  function logoutUser() {
    showLoading("Mengakhiri sesi aman...");
    sessionStorage.removeItem('sysrem_session');
    if (idleTimer) clearTimeout(idleTimer);
    
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(() => {
          hideLoading();
          AppState.isAuthenticated = false;
          AppState.currentUser = null;
          renderAuthScreen();
          showToast("Anda telah keluar dari sistem.", "info");
        })
        .apiLogout();
    } else {
      setTimeout(() => {
        hideLoading();
        AppState.isAuthenticated = false;
        AppState.currentUser = null;
        renderAuthScreen();
      }, 300);
    }
  }

  // ==========================================
  // 2. NAVIGATION & TABS
  // ==========================================

  function setupTabNavigation() {
    const navItems = document.querySelectorAll('.sidebar-nav .nav-item');
    navItems.forEach((item) => {
      item.addEventListener('click', (e) => {
        e.preventDefault();
        const tab = item.getAttribute('data-tab');
        switchTab(tab);
      });
    });
  }

  function switchTab(tabName) {
    logDebug("🔀", "Beralih ke tab:", tabName);
    AppState.currentTab = tabName;

    // Update active nav links
    document.querySelectorAll('.sidebar-nav .nav-item').forEach((link) => {
      if (link.getAttribute('data-tab') === tabName) {
        link.classList.add('active');
      } else {
        link.classList.remove('active');
      }
    });

    // Update tab pane visibility
    document.querySelectorAll('.tab-pane').forEach((pane) => {
      pane.classList.remove('active');
    });

    const targetPane = document.getElementById('tab' + tabName.charAt(0).toUpperCase() + tabName.slice(1));
    if (targetPane) {
      targetPane.classList.add('active');
    }

    // Update Page Title
    const titleMap = {
      overview: 'Dashboard Ringkasan Proyek',
      projects: 'Project Management & Lifecycle',
      progress: 'Pencatatan Progres Harian Proyek',
      settings: 'Pengaturan Sistem & Uji Notifikasi'
    };
    document.getElementById('pageTitle').textContent = titleMap[tabName] || 'Dashboard System';

    // Auto-refresh relevant data on tab entry
    if (tabName === 'overview') loadDashboardSummary();
    if (tabName === 'projects') loadProjects();
    if (tabName === 'progress') populateProjectDropdowns();
  }

  function setupMobileSidebar() {
    const toggleBtn = document.getElementById('mobileMenuToggle');
    const sidebar = document.querySelector('.sidebar');
    if (toggleBtn && sidebar) {
      toggleBtn.addEventListener('click', () => {
        sidebar.classList.toggle('open');
      });
    }
  }

  // ==========================================
  // 3. DASHBOARD DATA & PROJECT MANAGEMENT
  // ==========================================

  function loadProjects() {
    const statusFilter = document.getElementById('projectStatusFilter') ? document.getElementById('projectStatusFilter').value : "";
    
    // Tampilkan skeleton loader di tabel saat memulai request
    const projectListBody = document.getElementById('projectListTableBody');
    const overviewBody = document.getElementById('overviewProjectTableBody');
    const skeletonHtml = `
      <tr>
        <td colspan="8" class="text-center py-4">
          <div class="skeleton-loader skeleton-row"></div>
          <div class="skeleton-loader skeleton-row" style="width: 80%; margin: 0 auto;"></div>
        </td>
      </tr>
    `;
    if (projectListBody) projectListBody.innerHTML = skeletonHtml;
    if (overviewBody) overviewBody.innerHTML = skeletonHtml;

    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      renderProjectTables(getMockProjects());
      return;
    }

    logDebug("⏳", "Memuat data proyek...");
    google.script.run
      .withSuccessHandler((response) => {
        logDebug("✅", "GAS Response OK:", response);
        if (response && response.success) {
          logDebug("✅", "Data proyek berhasil dimuat", response.data);
          AppState.projects = response.data || [];
          renderProjectTables(AppState.projects);
          populateProjectDropdowns();
          updateKPIMetrics(AppState.projects);
        } else {
          showToast(response.error ? response.error.message : "Gagal memuat proyek", "error");
          renderProjectTables([]);
        }
      })
      .withFailureHandler((err) => {
        logDebug("❌", "GAS Response ERROR:", err);
        showToast(err.message || "Terjadi kesalahan sistem.", "error");
        renderProjectTables([]);
      })
      .apiGetAllProjects({ status: statusFilter });
  }

  function loadDashboardSummary() {
    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      loadProjects();
      return;
    }

    logDebug("⏳", "Memuat ringkasan dashboard (apiGetDashboardExecutiveSummary)...");
    google.script.run
      .withSuccessHandler((response) => {
        logDebug("✅", "GAS Response OK:", response);
        if (response && response.success && response.data) {
          const sum = response.data;
          document.getElementById('kpiTotalProjects').textContent = sum.activeProjects;
          document.getElementById('kpiOnTrack').textContent = sum.onTrackCount;
          document.getElementById('kpiDelayed').textContent = sum.delayedCount;
          document.getElementById('kpiCompleted').textContent = sum.completedProjects;
        } else if (response && response.error) {
          showToast(response.error.message, "error");
        }
      })
      .withFailureHandler((err) => {
        logDebug("❌", "GAS Response ERROR:", err);
        showToast(err.message || "Gagal memuat ringkasan dashboard.", "error");
      })
      .apiGetDashboardExecutiveSummary();
      loadProjects();
  }

  function updateKPIMetrics(projects) {
    let total = projects.length;
    let onTrack = 0;
    let delayed = 0;
    let completed = 0;

    projects.forEach((p) => {
      const st = p.summary ? p.summary.status : (p.status === 'COMPLETED' ? 'COMPLETED' : 'ON_TRACK');
      if (st === 'COMPLETED' || p.status === 'COMPLETED') completed++;
      else if (st === 'DELAYED') delayed++;
      else onTrack++;
    });

    document.getElementById('kpiTotalProjects').textContent = total;
    document.getElementById('kpiOnTrack').textContent = onTrack;
    document.getElementById('kpiDelayed').textContent = delayed;
    document.getElementById('kpiCompleted').textContent = completed;
  }

  function renderProjectTables(projects) {
    const overviewBody = document.getElementById('overviewProjectTableBody');
    const projectListBody = document.getElementById('projectListTableBody');

    if (!projects || projects.length === 0) {
      const emptyRow = '<tr><td colspan="8" class="text-center py-4" style="color: var(--text-muted);">Belum ada data proyek terdaftar.</td></tr>';
      if (overviewBody) overviewBody.innerHTML = emptyRow;
      if (projectListBody) projectListBody.innerHTML = emptyRow;
      return;
    }

    // 1. Overview Table
    if (overviewBody) {
      overviewBody.innerHTML = projects.map((item) => {
        const p = item.project || item;
        const s = item.summary || { plannedProgress: 0, actualProgress: 0, deviation: 0, status: p.status };
        const statusBadge = getStatusBadgeHtml(s.status || p.status);
        const devClass = s.deviation < 0 ? 'color: var(--accent-red); font-weight: 600;' : 'color: var(--accent-green);';
        const startLocal = formatDateLocal(p.start_date);
        const endLocal = formatDateLocal(p.end_date);

        return `
          <tr>
            <td><strong>${p.project_name || '-'}</strong></td>
            <td>${p.pic_name || '-'}<br><small style="color: var(--text-muted);">${p.pic_email || '-'}</small></td>
            <td><small>${startLocal}<br>${endLocal}</small></td>
            <td>${s.plannedProgress}%</td>
            <td><strong>${s.actualProgress}%</strong></td>
            <td style="${devClass}">${s.deviation > 0 ? '+' : ''}${s.deviation}%</td>
            <td>${statusBadge}</td>
            <td>
              <button type="button" class="btn btn-sm btn-outline" onclick="viewProjectCurve('${p.project_id}')">📈 Kurva S</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    // 2. Project Management Table
    if (projectListBody) {
      projectListBody.innerHTML = projects.map((item) => {
        const p = item.project || item;
        const statusBadge = getStatusBadgeHtml(p.status);
        const emailIcon = p.is_email_active ? '📧 On' : '📧 Off';
        const waIcon = p.is_wa_active ? '💬 On' : '💬 Off';
        const startLocal = formatDateLocal(p.start_date);
        const endLocal = formatDateLocal(p.end_date);

        return `
          <tr>
            <td>
              <strong>${p.project_name || '-'}</strong><br>
              <small style="color: var(--text-muted);">${p.project_id || '-'}</small>
            </td>
            <td>${p.pic_name || '-'} (${p.pic_phone || '-'})</td>
            <td><small>${startLocal} s.d. ${endLocal}</small></td>
            <td><small>${emailIcon} | ${waIcon}</small></td>
            <td>${statusBadge}</td>
            <td style="text-align: right;">
              <button type="button" class="btn btn-sm btn-outline" onclick="viewProjectCurve('${p.project_id}')">📈 S-Curve</button>
              <button type="button" class="btn btn-sm btn-outline" style="color: var(--accent-red); border-color: rgba(244,63,94,0.3);" onclick="confirmDeleteProject('${p.project_id}', '${p.project_name}')">🗑️</button>
            </td>
          </tr>
        `;
      }).join('');
    }
  }

  function getStatusBadgeHtml(status) {
    switch (status) {
      case 'ON_TRACK':
      case 'AHEAD':
        return '<span class="status-badge badge-on-track">✅ On Track</span>';
      case 'DELAYED':
        return '<span class="status-badge badge-delayed">⚠️ Delayed</span>';
      case 'COMPLETED':
        return '<span class="status-badge badge-completed">🎉 Selesai</span>';
      default:
        return `<span class="status-badge badge-active">${status || 'ACTIVE'}</span>`;
    }
  }

  function handleProjectSearch(keyword) {
    const clean = keyword.toLowerCase();
    const filtered = AppState.projects.filter((item) => {
      const p = item.project || item;
      return (p.project_name && p.project_name.toLowerCase().includes(clean)) ||
             (p.pic_name && p.pic_name.toLowerCase().includes(clean)) ||
             (p.pic_email && p.pic_email.toLowerCase().includes(clean));
    });
    renderProjectTables(filtered);
  }

  function populateProjectDropdowns() {
    const selects = [
      document.getElementById('progressProjectSelect'), 
      document.getElementById('progModalProject'),
      document.getElementById('sCurveProjectSelect')
    ];
    selects.forEach((sel) => {
      if (!sel) return;
      const currentVal = sel.value;
      sel.innerHTML = '<option value="">-- Pilih Proyek --</option>' +
        AppState.projects.map((item) => {
          const p = item.project || item;
          return `<option value="${p.project_id || ''}">${p.project_name || 'Tanpa Nama'}</option>`;
        }).join('');
      if (currentVal) sel.value = currentVal;
    });

    // Populate Status Filter dynamically
    const statusFilter = document.getElementById('projectStatusFilter');
    if (statusFilter) {
      const currentFilter = statusFilter.value;
      const uniqueStatuses = [...new Set(AppState.projects.map((item) => (item.project || item).status).filter(Boolean))];
      statusFilter.innerHTML = '<option value="">Semua Status</option>' +
        uniqueStatuses.map(s => `<option value="${s}">${s}</option>`).join('');
      if (currentFilter && uniqueStatuses.includes(currentFilter)) {
        statusFilter.value = currentFilter;
      }
    }
  }

  // ==========================================
  // 4. DAILY PROGRESS & S-CURVE MODAL
  // ==========================================

  function loadProjectProgressLogs(projectId) {
    if (!projectId) {
      document.getElementById('progressLogsTableBody').innerHTML = '<tr><td colspan="7" class="text-center py-4">Silakan pilih proyek.</td></tr>';
      return;
    }

    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      renderProgressLogsTable([
        { report_date: "2026-03-01", planned_progress: 15, actual_progress: 15, deviation: 0, notes: "Pondasi awal", recorded_by: "admin@test" }
      ]);
      return;
    }

    const tbody = document.getElementById('progressLogsTableBody');
    if (tbody) {
      tbody.innerHTML = `
        <tr>
          <td colspan="7" class="text-center py-4">
            <div class="skeleton-loader skeleton-row"></div>
            <div class="skeleton-loader skeleton-row" style="width: 80%; margin: 0 auto;"></div>
          </td>
        </tr>
      `;
    }

    showLoading("Memuat riwayat progres harian...");
    logDebug("⏳", "Memanggil apiGetProgressHistory untuk proyek:", projectId);
    
    google.script.run
      .withSuccessHandler((response) => {
        logDebug("✅", "GAS Response OK:", response);
        hideLoading();
        if (response && response.success) {
          renderProgressLogsTable(response.data || []);
        }
      })
      .apiGetProgressHistory(projectId, "desc");
  }

  function renderProgressLogsTable(logs) {
    const tbody = document.getElementById('progressLogsTableBody');
    if (!logs || logs.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4" style="color: var(--text-muted);">Belum ada catatan progres harian untuk proyek ini.</td></tr>';
      return;
    }

    tbody.innerHTML = logs.map((l) => {
      const devClass = l.deviation < 0 ? 'color: var(--accent-red); font-weight: 600;' : 'color: var(--accent-green);';
      const localDate = formatDateLocal(l.report_date || l.date);
      return `
        <tr>
          <td><strong>${localDate}</strong></td>
          <td>${l.planned_progress}%</td>
          <td><strong>${l.actual_progress}%</strong></td>
          <td style="${devClass}">${l.deviation > 0 ? '+' : ''}${l.deviation}%</td>
          <td>${l.notes || '-'}</td>
          <td><small style="color: var(--text-muted);">${l.recorded_by}</small></td>
          <td>
            <button type="button" class="btn btn-sm btn-outline" style="color: var(--accent-red);" onclick="deleteProgressLog('${l.progress_id}')">Hapus</button>
          </td>
        </tr>
      `;
    }).join('');
  }

  let sCurveChartInst = null;

  function loadWBSData(projectId) {
    const select = document.getElementById('sCurveProjectSelect');
    if (!projectId && select) projectId = select.value;
    if (select && select.value !== projectId) select.value = projectId;

    if (!projectId) {
      document.getElementById('sCurveEmptyState').classList.remove('hidden');
      document.getElementById('sCurveContainer').classList.add('hidden');
      return;
    }

    const scale = document.getElementById('periodScaleSelect').value;

    document.getElementById('sCurveEmptyState').classList.add('hidden');
    document.getElementById('sCurveContainer').classList.remove('hidden');

    // Kosongkan tabel
    const thead = document.getElementById('wbsTableHeader');
    const tbody = document.getElementById('wbsTableBody');
    const tfoot = document.getElementById('wbsTableFooter');
    if(thead) thead.innerHTML = '';
    if(tbody) tbody.innerHTML = '<tr><td colspan="10" class="text-center">Memuat data WBS...</td></tr>';
    if(tfoot) tfoot.innerHTML = '';

    showLoading("Memuat Time Schedule WBS...");
    
    google.script.run
      .withSuccessHandler((response) => {
        hideLoading();
        if (response && response.success) {
          renderWbsTableAndChart(response.data);
        } else {
          showToast(response.error ? response.error.message : "Gagal memuat WBS", "error");
        }
      })
      .withFailureHandler((err) => {
        hideLoading();
        showToast(err.message || "Kesalahan jaringan", "error");
      })
      .apiGetProjectWBSAndSchedule(projectId, scale);
  }

  function renderWbsTableAndChart(data) {
    const thead = document.getElementById('wbsTableHeader');
    const tbody = document.getElementById('wbsTableBody');
    const tfoot = document.getElementById('wbsTableFooter');

    // 1. Render Header
    let headHtml = `<th>No</th><th>Keterangan</th><th>Bobot (%)</th><th>Tanggal</th>`;
    data.periods.forEach(p => {
      headHtml += `<th>${p}</th>`;
    });
    headHtml += `<th>Aksi</th>`;
    thead.innerHTML = headHtml;

    // 2. Render Body (WBS Items)
    if (data.wbs.length === 0) {
      tbody.innerHTML = `<tr><td colspan="${data.periods.length + 5}" class="text-center py-4">Belum ada item WBS.</td></tr>`;
    } else {
      let bodyHtml = '';
      data.wbs.forEach((item, index) => {
        let rowHtml = `
          <tr>
            <td>${index + 1}</td>
            <td>${item.task_name}</td>
            <td>${item.weight}%</td>
            <td><small>${formatDateLocal(item.start_date)} - ${formatDateLocal(item.end_date)}</small></td>
        `;
        item.distribution.forEach(val => {
          rowHtml += `<td>${val > 0 ? val.toFixed(2) : '-'}</td>`;
        });
        rowHtml += `
            <td>
              <button class="btn btn-sm btn-outline" style="color:var(--accent-red);" onclick="deleteWbsItem('${item.wbs_id}')">Hapus</button>
            </td>
          </tr>
        `;
        bodyHtml += rowHtml;
      });
      tbody.innerHTML = bodyHtml;
    }

    // 3. Render Footer (Summary)
    const sum = data.summary;
    let footHtml = `
      <tr><td colspan="4" class="text-right"><strong>Bobot Rencana</strong></td>${sum.bobot_rencana.map(v => `<td>${v.toFixed(2)}</td>`).join('')}<td></td></tr>
      <tr><td colspan="4" class="text-right" style="color:#ef4444;"><strong>Akumulasi Rencana</strong></td>${sum.akumulasi_rencana.map(v => `<td style="color:#ef4444;">${v.toFixed(2)}</td>`).join('')}<td></td></tr>
      <tr><td colspan="4" class="text-right"><strong>Bobot Pelaksanaan</strong></td>${sum.bobot_pelaksanaan.map(v => `<td>${v.toFixed(2)}</td>`).join('')}<td></td></tr>
      <tr><td colspan="4" class="text-right" style="color:#10b981;"><strong>Akumulasi Pelaksanaan</strong></td>${sum.akumulasi_pelaksanaan.map(v => `<td style="color:#10b981;">${v.toFixed(2)}</td>`).join('')}<td></td></tr>
      <tr><td colspan="4" class="text-right"><strong>Deviasi</strong></td>${sum.deviasi.map(v => `<td style="${v < 0 ? 'color:#ef4444;' : 'color:#10b981;'}">${v > 0 ? '+' : ''}${v.toFixed(2)}</td>`).join('')}<td></td></tr>
    `;
    tfoot.innerHTML = footHtml;

    // 4. Render Chart
    drawSCurveChartWBS(data.periods, sum.akumulasi_rencana, sum.akumulasi_pelaksanaan);
  }

  function drawSCurveChartWBS(labels, plannedData, actualData) {
    const canvas = document.getElementById('sCurveChart');
    if (!canvas) return;
    
    if (sCurveChartInst) {
      sCurveChartInst.destroy();
    }

    sCurveChartInst = new Chart(canvas, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [
          {
            label: 'Aktual (Line Hijau)',
            data: actualData,
            borderColor: '#10b981', // Hijau
            backgroundColor: 'rgba(16, 185, 129, 0.1)',
            borderWidth: 3,
            tension: 0.4,
            fill: true,
            yAxisID: 'y'
          },
          {
            label: 'Rencana (S-Curve Merah)',
            data: plannedData,
            borderColor: '#ef4444', // Merah
            borderWidth: 3,
            borderDash: [5, 5],
            tension: 0.4,
            fill: false,
            yAxisID: 'y'
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            position: 'top',
            labels: { color: '#f8fafc', font: { family: 'Inter' } }
          },
          tooltip: { mode: 'index', intersect: false }
        },
        scales: {
          x: {
            grid: { color: 'rgba(255,255,255,0.05)' },
            ticks: { color: '#94a3b8' }
          },
          y: {
            min: 0,
            max: 100,
            position: 'right', // Sumbu Y skala 0-100% dikanan sesuai request
            grid: { color: 'rgba(255,255,255,0.05)' },
            ticks: { color: '#94a3b8', callback: function(value) { return value + '%'; } },
            title: { display: true, text: 'Scale 0-100%', color: '#94a3b8'}
          }
        }
      }
    });
  }

  function formatDateLocal(isoString) {
    if (!isoString || isoString === '-') return '-';
    try {
      const d = new Date(isoString);
      if (isNaN(d.getTime())) return isoString;
      return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
    } catch (e) {
      return isoString;
    }
  }

  function showLoading(msg) {
    const el = document.getElementById('globalLoading');
    if (el) {
      if (msg) document.getElementById('loadingText').textContent = msg;
      el.classList.remove('hidden');
    }
  }

  function hideLoading() {
    const el = document.getElementById('globalLoading');
    if (el) el.classList.add('hidden');
  }

  function showToast(message, type = 'info') {
    const container = document.getElementById('toastContainer');
    if (!container) return;
    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    const iconMap = { success: '✅', error: '❌', info: 'ℹ️' };
    toast.innerHTML = `<span>${iconMap[type] || 'ℹ️'}</span><span>${message}</span>`;
    container.appendChild(toast);
    setTimeout(() => {
      toast.style.opacity = '0';
      toast.style.transform = 'translateX(100%)';
      setTimeout(() => toast.remove(), 300);
    }, 4000);
  }

  function setupPasswordToggles() {
    document.querySelectorAll('.toggle-password').forEach((btn) => {
      btn.addEventListener('click', () => {
        const input = btn.previousElementSibling;
        if (input && input.tagName === 'INPUT') {
          const isPass = input.getAttribute('type') === 'password';
          input.setAttribute('type', isPass ? 'text' : 'password');
          btn.textContent = isPass ? '👁️' : '🔒';
        }
      });
    });
  }

  function setupPasswordPolicyLiveCheck() {
    const newPassInput = document.getElementById('newPassword');
    if (!newPassInput) return;

    newPassInput.addEventListener('input', (e) => {
      const val = e.target.value;
      updatePolicyRule('ruleLength', val.length >= 8);
      updatePolicyRule('ruleUpper', /[A-Z]/.test(val));
      updatePolicyRule('ruleLower', /[a-z]/.test(val));
      updatePolicyRule('ruleNumber', /[0-9]/.test(val));
      updatePolicyRule('ruleSpecial', /[^a-zA-Z0-9]/.test(val));
    });
  }

  function updatePolicyRule(elementId, isValid) {
    const el = document.getElementById(elementId);
    if (el) {
      if (isValid) el.classList.add('valid');
      else el.classList.remove('valid');
    }
  }

  function renderUsersTable(users) {
    const tbody = document.getElementById('usersTableBody');
    if (!tbody) return;

    if (!users || users.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted">Belum ada pengguna.</td></tr>';
      return;
    }

    tbody.innerHTML = users.map(u => {
      const activeBadge = u.is_active ? '<span class="status-badge status-active">Aktif</span>' : '<span class="status-badge status-delayed">Nonaktif</span>';
      const lastLogin = u.last_login_at ? formatDateLocal(u.last_login_at) : "Belum pernah";
      return `
        <tr>
          <td><strong>${u.username}</strong></td>
          <td>${u.email}</td>
          <td>${u.role_name}</td>
          <td>${activeBadge}</td>
          <td><small class="text-muted">${lastLogin}</small></td>
          <td>
            <button type="button" class="btn btn-sm btn-outline" onclick="showToast('Edit pengguna belum diimplementasikan.', 'info')">Edit</button>

        </tr>

    }).join('');
  }
